version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn; majors still come through individually.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # `directory: /` only covers .github/workflows. The composite action pins
  # its own `uses:` versions and is otherwise invisible to Dependabot.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup
    schedule:
      interval: weekly
