name: Setup
description: Install the pinned Node version and install dependencies. Callers check out the repo themselves.

runs:
  using: composite
  steps:
    # No actions/checkout here: every caller in ci.yml already checks out
    # before `uses: ./.github/actions/setup` (a local action cannot even be
    # resolved until the checkout has happened), so a second one only
    # re-downloaded the tree and reset anything a caller had staged.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash
