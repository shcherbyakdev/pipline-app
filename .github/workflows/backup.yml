name: Backup

# Supabase Free has no restorable backups, so this dump is the ONLY restore
# path (spec §10). Daily, so worst-case data loss is 24 hours.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets reach scripts through env, never `${{ secrets.X }}` inside a
    # `run:` body: that form pastes the value into the shell source verbatim,
    # so a pooler password containing a quote or `$` becomes shell syntax.
    env:
      DB_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # This workflow is committed at spec step 2, before the GitHub secrets
      # it needs arrive at cutover step 9 — with Resend verification and DNS
      # propagation in between, potentially days. Without this guard the
      # scheduled run fails every night in that window, normalising a red
      # Backup job for the only restore path this project has on Supabase
      # Free. Remove this step once the secrets are in place.
      - name: Guard against running before secrets exist
        id: guard
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet (pre-cutover-step-9) — skipping backup run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'

      # Pinned, not `latest`: this CLI's dump flags and its bundled pg_dump are
      # what the restore procedure in docs/runbook-production.md §4 was
      # verified against. Bump deliberately (ci.yml carries the same pin), and
      # re-run a restore drill when you do.
      - uses: supabase/setup-cli@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          version: 2.75.0

      # `supabase db dump` ships a version-matched dump binary. Raw pg_dump
      # from ubuntu-latest is client 16 and aborts against our PostgreSQL 17.
      #
      # TWO dumps, because a bare `supabase db dump` runs `pg_dump
      # --schema-only`: on its own it looks like a backup and restores an
      # empty database. `--data-only` is the half that holds the bookings.
      #
      # Schemas: public + auth + storage + drizzle.
      #   auth    — omit it and user accounts are unrestorable.
      #   drizzle — holds __drizzle_migrations, the migration journal. Restore
      #             without it and the next `drizzle-kit migrate` re-runs the
      #             full migration chain against an already-populated database.
      - name: Dump schema
        if: steps.guard.outputs.ready == 'true'
        run: |
          supabase db dump \
            --db-url "$DB_URL" \
            -s public -s auth -s storage -s drizzle \
            -f schema.sql

      - name: Dump data
        if: steps.guard.outputs.ready == 'true'
        run: |
          supabase db dump \
            --db-url "$DB_URL" \
            --data-only --use-copy \
            -s public -s auth -s storage -s drizzle \
            -f data.sql
          # A data dump with no COPY block is an empty backup that would
          # upload green and only be discovered at restore time.
          if ! grep -q '^COPY ' data.sql; then
            echo "::error::data.sql contains no COPY statements — the data dump is empty."
            exit 1
          fi

      # The dump contains client names and email addresses. An unencrypted
      # artifact would be a PII leak.
      - name: Encrypt
        if: steps.guard.outputs.ready == 'true'
        run: |
          stamp="$(date -u +%Y%m%d)"
          for part in schema data; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 \
              -in "$part.sql" -out "booklo-$stamp-$part.sql.enc" \
              -pass env:BACKUP_PASSPHRASE
            rm "$part.sql"
          done
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      # GitHub Free allows 500MB of artifact storage in total, with a 90-day
      # default retention that daily dumps would quietly exhaust.
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          name: booklo-backup-${{ github.run_id }}
          path: "*.sql.enc"
          retention-days: 7
