<!doctype html><meta charset="utf-8">
<!--
  The landing hero's backdrop (src/features/marketing/images/hero-wash.webp):
  an abstract wash in the dark theme's tokens (globals.css `.dark`: ground
  #111212, card #19191b, panel #242526, accent #6975e2) — layered ridges
  with painted edges (turbulence displacement + blur), one accent light
  pool, vertical glass streaks (grain is the CSS overlay, not baked) — drawn from our own
  tokens so it is ours, not a stock painting.
  Re-render: open this file in Chromium at 2400x1400 and screenshot it, e.g.
    node -e 'import("playwright").then(async({chromium})=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:2400,height:1400}});await p.goto("file://"+process.cwd()+"/scripts/landing-wash.html");await p.waitForTimeout(1200);await p.screenshot({path:"hero-wash.png"});await b.close();})'
  then convert to WebP (quality ~82) into src/features/marketing/images/.
-->
<style>html,body{margin:0;background:#fff}svg{display:block}</style>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="0.45" stop-color="#18181b"/>
      <stop offset="1" stop-color="#0f0f10"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2d31"/><stop offset="1" stop-color="#242526"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f1f22"/><stop offset="1" stop-color="#19191b"/></linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151517"/><stop offset="1" stop-color="#0e0e0f"/></linearGradient>
    <radialGradient id="mint" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6975e2" stop-opacity="0.22"/><stop offset="1" stop-color="#6975e2" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6975e2" stop-opacity="0.16"/><stop offset="1" stop-color="#6975e2" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b94ea" stop-opacity="0.45"/><stop offset="1" stop-color="#8b94ea" stop-opacity="0"/></radialGradient>
    <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="140" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="60"/></filter>
    <!-- fluted-glass streaks (futureui "fractal glass"): a turbulence that
         is wide across and tight down displaces the painting into vertical
         smears, then a vertical-only blur pulls them into streaks -->
    <filter id="streak" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0 14"/>
    </filter>
    <!-- a light bake of grain; the visible film noise is the CSS overlay
         (.hero-grain in globals.css) so the WebP stays small and the grain
         stays crisp at every pixel density -->
    <filter id="grain-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.05 0.3"/></feComponentTransfer>
    </filter>
    <filter id="grain-light" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="11" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.04 0.26"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="2400" height="1400" fill="url(#sky)"/>
  <g filter="url(#streak)">
    <rect width="2400" height="1400" fill="url(#sky)"/>
    <!-- soft light and colour pools -->
    <ellipse cx="1500" cy="330" rx="900" ry="420" fill="url(#glow)" filter="url(#soft)"/>
    <ellipse cx="520" cy="620" rx="620" ry="360" fill="url(#pink)" filter="url(#soft)"/>
    <ellipse cx="1900" cy="820" rx="700" ry="300" fill="url(#mint)" filter="url(#soft)"/>
    <!-- ridges: far to near, painted edges -->
    <g filter="url(#paint)">
      <path d="M-100 760 C 300 560, 520 500, 780 640 C 980 750, 1180 520, 1420 600 C 1650 680, 1850 430, 2100 560 C 2300 660, 2450 640, 2500 700 L 2500 1500 L -100 1500 Z" fill="url(#r1)" opacity="0.85"/>
      <path d="M-100 900 C 240 780, 480 720, 700 820 C 940 930, 1120 700, 1400 780 C 1700 870, 1900 760, 2500 860 L 2500 1500 L -100 1500 Z" fill="url(#r2)" opacity="0.9"/>
      <path d="M-100 1080 C 300 980, 560 1000, 860 1060 C 1160 1120, 1460 960, 1760 1010 C 2060 1060, 2260 990, 2500 1040 L 2500 1500 L -100 1500 Z" fill="url(#r3)" opacity="0.92"/>
    </g>
  </g>
  <!-- no baked grain: on a dark ground it costs 300 KB of WebP; the CSS
       overlay (.hero-grain) carries the film noise instead -->
</svg>
